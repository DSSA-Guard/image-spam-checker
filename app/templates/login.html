{% extends "base.html" %}
{% block title %}로그인 · 이미지 검사 서버{% endblock %}
{% block body %}
<div class="card" style="max-width:380px;margin:60px auto">
  <h1 style="margin-bottom:16px">이미지 검사 서버 관리</h1>
  {% if error %}<p class="error">비밀번호가 맞지 않아요.</p>{% endif %}
  <form method="post" action="/admin/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <p><input type="password" name="password" placeholder="관리자 비밀번호" autocomplete="current-password" required autofocus></p>
    <button type="submit" style="width:100%">로그인</button>
  </form>
</div>
{% endblock %}
